<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c6fc4"/></marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b8a3e"/></marker>
    <marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="760" height="470" fill="#ffffff"/>

  <!-- 패널 제목 -->
  <text x="190" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#222">준비자세 (서기)</text>
  <text x="560" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#222">가장 낮은 자세 (저점)</text>
  <line x1="375" y1="20" x2="375" y2="330" stroke="#ddd" stroke-width="1.5"/>

  <!-- ===== 준비자세: 몸 중앙선 x=190 ===== -->
  <line x1="190" y1="50" x2="190" y2="315" stroke="#bbb" stroke-dasharray="4 4"/>
  <g stroke="#333" stroke-width="4" stroke-linecap="round" fill="none">
    <circle cx="190" cy="62" r="12" stroke-width="3"/>
    <line x1="160" y1="85" x2="220" y2="85"/>
    <line x1="160" y1="85" x2="168" y2="155"/><line x1="220" y1="85" x2="212" y2="155"/>
    <line x1="168" y1="155" x2="212" y2="155"/>
    <line x1="168" y1="155" x2="165" y2="225"/><line x1="165" y1="225" x2="163" y2="295"/>
    <line x1="212" y1="155" x2="215" y2="225"/><line x1="215" y1="225" x2="217" y2="295"/>
  </g>
  <g fill="#333"><circle cx="165" cy="225" r="6"/><circle cx="215" cy="225" r="6"/><circle cx="163" cy="295" r="5"/><circle cx="217" cy="295" r="5"/><circle cx="168" cy="155" r="5"/><circle cx="212" cy="155" r="5"/></g>
  <!-- 서기 무릎 간격 w_s -->
  <line x1="165" y1="240" x2="215" y2="240" stroke="#1c6fc4" stroke-width="2" marker-start="url(#arB)" marker-end="url(#arB)"/>
  <text x="152" y="245" text-anchor="end" font-size="14" fill="#1c6fc4" font-weight="700">w서기</text>
  <!-- 발목 폭 W -->
  <line x1="163" y1="312" x2="217" y2="312" stroke="#555" stroke-width="2" marker-start="url(#arK)" marker-end="url(#arK)"/>
  <text x="190" y="330" text-anchor="middle" font-size="14" fill="#555" font-weight="700">W (발목 폭)</text>
  <!-- 골반-발목 세로거리 h_s -->
  <line x1="250" y1="155" x2="250" y2="295" stroke="#2b8a3e" stroke-width="2" marker-start="url(#arG)" marker-end="url(#arG)"/>
  <text x="258" y="230" font-size="14" fill="#2b8a3e" font-weight="700">h서기</text>

  <!-- ===== 저점: 몸 중앙선 x=560 ===== -->
  <line x1="560" y1="50" x2="560" y2="315" stroke="#bbb" stroke-dasharray="4 4"/>
  <g stroke="#333" stroke-width="4" stroke-linecap="round" fill="none">
    <circle cx="560" cy="122" r="12" stroke-width="3"/>
    <line x1="530" y1="145" x2="590" y2="145"/>
    <line x1="530" y1="145" x2="538" y2="210"/><line x1="590" y1="145" x2="582" y2="210"/>
    <line x1="538" y1="210" x2="582" y2="210"/>
    <line x1="538" y1="210" x2="545" y2="250"/><line x1="545" y1="250" x2="533" y2="295"/>
    <line x1="582" y1="210" x2="575" y2="250"/><line x1="575" y1="250" x2="587" y2="295"/>
  </g>
  <g fill="#333"><circle cx="545" cy="250" r="6"/><circle cx="575" cy="250" r="6"/><circle cx="533" cy="295" r="5"/><circle cx="587" cy="295" r="5"/><circle cx="538" cy="210" r="5"/><circle cx="582" cy="210" r="5"/></g>
  <!-- 서기 때 무릎 x 위치 (유령) -->
  <g fill="none" stroke="#d9480f" stroke-width="2" stroke-dasharray="3 3"><circle cx="535" cy="250" r="7"/><circle cx="585" cy="250" r="7"/></g>
  <text x="498" y="236" text-anchor="end" font-size="12" fill="#d9480f">서기 때</text>
  <text x="498" y="250" text-anchor="end" font-size="12" fill="#d9480f">무릎 위치</text>
  <!-- A45 이동 화살표 -->
  <line x1="530" y1="268" x2="543" y2="268" stroke="#d9480f" stroke-width="2.5" marker-end="url(#arO)"/>
  <line x1="590" y1="268" x2="577" y2="268" stroke="#d9480f" stroke-width="2.5" marker-end="url(#arO)"/>
  <text x="520" y="284" text-anchor="end" font-size="13" fill="#d9480f" font-weight="700">Δx왼</text>
  <text x="600" y="284" font-size="13" fill="#d9480f" font-weight="700">Δx오른</text>
  <!-- 저점 무릎 간격 w_b -->
  <line x1="545" y1="232" x2="575" y2="232" stroke="#1c6fc4" stroke-width="2" marker-start="url(#arB)" marker-end="url(#arB)"/>
  <text x="560" y="200" text-anchor="middle" font-size="14" fill="#1c6fc4" font-weight="700">w저점</text>
  <!-- 발목 폭 (저점) -->
  <line x1="533" y1="312" x2="587" y2="312" stroke="#555" stroke-width="2" marker-start="url(#arK)" marker-end="url(#arK)"/>
  <text x="560" y="330" text-anchor="middle" font-size="14" fill="#555">발목</text>
  <!-- h_b -->
  <line x1="668" y1="210" x2="668" y2="295" stroke="#2b8a3e" stroke-width="2" marker-start="url(#arG)" marker-end="url(#arG)"/>
  <text x="676" y="258" font-size="14" fill="#2b8a3e" font-weight="700">h저점</text>

  <!-- ===== 정의 ===== -->
  <rect x="20" y="350" width="720" height="108" rx="8" fill="#f6f7f9" stroke="#e1e4e8"/>
  <text x="40" y="378" font-size="15" fill="#1c6fc4" font-weight="700">A2</text>
  <text x="95" y="378" font-size="15" fill="#222">= w저점 ÷ w서기</text>
  <text x="330" y="378" font-size="13" fill="#555">저점 무릎 간격을 준비자세 무릎 간격과 비교한 비율</text>
  <text x="40" y="408" font-size="15" fill="#d9480f" font-weight="700">A45</text>
  <text x="95" y="408" font-size="15" fill="#222">= ½ (Δx왼 + Δx오른) ÷ W</text>
  <text x="330" y="408" font-size="13" fill="#555">무릎의 서기→저점 수평 이동, 몸 중앙 쪽이 + (안쪽 이동)</text>
  <text x="40" y="438" font-size="15" fill="#2b8a3e" font-weight="700">D1</text>
  <text x="95" y="438" font-size="15" fill="#222">= h저점 ÷ h서기</text>
  <text x="330" y="438" font-size="13" fill="#555">준비자세 대비 골반–발목 세로거리 (작을수록 깊게 앉음)</text>
</svg>
